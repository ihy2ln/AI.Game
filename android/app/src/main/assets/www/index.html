<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0a0c10">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <title>AI.Game — Farm</title>
  <link rel="stylesheet" href="./css/farm.css">
</head>
<body>
  <div class="app">
    <main class="stage">
      <canvas id="farm" aria-label="Farm map"></canvas>
    </main>

    <div class="hud-top">
      <div class="brand-chip">AI.Game <span>Farm</span></div>
      <div class="stat-chip">
        <div class="stat-row">
          <span class="label">Farm Lv</span>
          <span id="level">1</span>
        </div>
        <div class="stat-row">
          <span class="label">XP</span>
          <span id="xp">0 / 15</span>
        </div>
        <div class="xp-track"><div class="xp-fill" id="xpBar"></div></div>
        <div class="meta-line"><span id="mapName">Starter</span> · <span id="mapSize">4×4</span> · cleared <span id="cleared">0</span>/<span id="remaining">0</span></div>
      </div>
    </div>

    <aside class="hud-side">
      <section class="panel">
        <h2>Tile</h2>
        <div id="tileInfo"></div>
      </section>
      <section class="panel">
        <h2>Clearance</h2>
        <div class="legend">
          <div><span>Weed</span><b>Lv.1</b></div>
          <div><span>Bush / Rock / Stump</span><b>Lv.2</b></div>
          <div><span>Oak Tree</span><b>Lv.3</b></div>
          <div><span>Boulder</span><b>Lv.4</b></div>
        </div>
      </section>
    </aside>

    <div class="log-dock" id="log" aria-live="polite"></div>

    <div class="touch-pad" aria-label="Touch controls">
      <button type="button" class="up" data-move="0,-1" aria-label="Up">▲</button>
      <button type="button" class="left" data-move="-1,0" aria-label="Left">◀</button>
      <button type="button" class="clear" id="btnClear" aria-label="Clear">CLEAR</button>
      <button type="button" class="right" data-move="1,0" aria-label="Right">▶</button>
      <button type="button" class="down" data-move="0,1" aria-label="Down">▼</button>
    </div>
  </div>

  <script type="module" src="./js/main.js"></script>
</body>
</html>
