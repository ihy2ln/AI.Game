plugins {
    id 'com.android.application'
}

android {
    namespace 'com.aigame.farm'
    compileSdk 34

    defaultConfig {
        applicationId "com.aigame.farm"
        minSdk 24
        targetSdk 34
        versionCode 2
        versionName "0.2.0-farm-apk"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            debuggable true
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
}
