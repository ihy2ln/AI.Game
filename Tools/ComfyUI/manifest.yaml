# Battle vertical slice asset manifest.
# Every asset the slice needs, in one file. Seeds are pinned -- same manifest + same
# models = same assets, regeneration is deterministic and reviewable as a diff.
# See Tools/ComfyUI/README.md and generate.py --help.

comfyui:
  base_url: "http://127.0.0.1:8188"

models:
  # Confirmed with project owner -- do not swap without asking (see M1 notes in
  # PROJECT-README.md). Avoid the NSFW-branded Krea2 variants also present on this
  # machine (pornmasterKrea2, Krea2_HMNSFW_AIO, saggy-krea) -- not what this project wants.
  still_checkpoint: "Krea2\\moodyKrea2Mix_v50.safetensors"
  clip_diffusion_model: "MiniMaxH3\\minimax_h3_ref2va_pruned_int8_convrot.safetensors"
  clip_vae: "MiniMaxH3\\minimax_h3_video_vae_fp16.safetensors"
  clip_turbo_lora: "H3\\minimax_h3_turbo_4step_ckpt500.safetensors"

# FOUNDATION.md 3.4 -- two separate prompt templates, one for environment (haze,
# desaturation, muted earth tones) and one for characters (rim lighting, high local
# contrast, warmer skin, strong silhouette). Master palette: Wuthering Waves-style,
# desaturated/cool/muted, quantized to 32-48 colors in postprocessing, not prompted.
prompt_templates:
  environment_suffix: >-
    desaturated cool muted color palette, hazy atmosphere, painterly anime
    background art, wuthering waves style, cinematic lighting, no text, no watermark
  character_suffix: >-
    anime character art, rim lighting, high local contrast, strong silhouette,
    warm skin tones, clean linework, dragon traveler / brown dust 2 art style,
    stylized adult character design, plain solid color background, no text, no watermark
  negative_default: >-
    text, watermark, signature, blurry, extra limbs, deformed hands, lowres,
    jpeg artifacts, cropped

# Solid background used for sprite/FX stills so postprocess.py can key them to
# transparency with the same technique as the video chroma key (simple color-distance
# threshold, no ML segmentation dependency).
chroma_key: "#00FF00"
chroma_tolerance: 40

output_root: "Unity/Assets/Art/Generated"

assets:
  # -- Battle background (1) --------------------------------------------------
  - id: bg_battle01
    type: background
    workflow: background.json
    prompt: >-
      wide battle arena, modern-day archipelago island setting, open clearing
      with distant coastline, isometric-friendly wide framing
    seed: 100001
    gen_width: 1536
    gen_height: 864
    final_width: 1920
    final_height: 1080
    output: "backgrounds/bg_battle01.png"

  # -- Unit pixel sprites (6), 32x32, transparent -----------------------------
  - id: char_player_melee_sprite32
    type: sprite
    unit_id: player_melee
    workflow: character_sprite.json
