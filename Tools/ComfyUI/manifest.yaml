  # -- Attack clips (3), shared across units by element/skill type ------------
  # Each clip is generated from its own throwaway i2v reference frame (rendered via
  # character_sprite.json at clip generation time, same seed, discarded after use) --
  # this satisfies FOUNDATION.md's "i2v from one canonical reference image, fixed
  # seed" consistency rule without needing final character art to exist yet.
  - id: clip_melee_basic
    type: clip
    workflow: character_clip.json
    reference_prompt: "young swordfighter mid-swing, dynamic action pose, plain solid color background"
    prompt: "character swings a sword forward in a fast melee attack, impact on the swing"
    seed: 100301
    gen_width: 512
    gen_height: 768
    fps: 24
    frame_count: 32
    impact_frames: [18]
    output: "clips/clip_melee_basic.mp4"

  - id: clip_ranged_basic
    type: clip
    workflow: character_clip.json
    reference_prompt: "young archer drawing a bow, dynamic action pose, plain solid color background"
    prompt: "character draws a bow and fires an arrow forward in a fast ranged attack"
    seed: 100302
    gen_width: 512
    gen_height: 768
    fps: 24
    frame_count: 32
    impact_frames: [22]
    output: "clips/clip_ranged_basic.mp4"

  - id: clip_heal_basic
    type: clip
    workflow: character_clip.json
    reference_prompt: "young healer channeling magic, staff raised, plain solid color background"
    prompt: "character channels healing light from a raised staff, gentle casting motion"
    seed: 100303
    gen_width: 512
    gen_height: 768
    fps: 24
    frame_count: 32
    impact_frames: [16, 24]
    output: "clips/clip_heal_basic.mp4"

  # -- Hit FX flipbook (1), 8 frames, transparent, packed to a sprite sheet ----
  - id: fx_hit_impact
    type: fx
    workflow: fx.json
    prompt: "small bright impact burst, spark flash, simple flat game vfx, radial shape"
    seed: 100401
    gen_width: 256
    gen_height: 256
    final_width: 64
    final_height: 64
    frame_count: 8
    keyed: true
    prekeyed: true
    # Fire/orange effect palette overlaps the project's usual green key -- blue keys
    # cleanly instead. See Tools/ComfyUI/README.md "Workflow node graphs" section.
    chroma_key_override: "#0000FF"
    chroma_tolerance_override: 18
    output: "fx/fx_hit_impact_sheet.png"
